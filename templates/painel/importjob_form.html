{% extends "painel/base.html" %}
{% block title %}Nova importação{% endblock %}
{% block content %}
<a class="back" href="{% url 'painel:importjob_list' cliente.id %}">&larr; Importações</a>
<h1>Nova importação</h1>
<p class="sub">CSV ou Excel com colunas: <code>nome</code>, <code>telefone</code>, <code>tags</code> (opcional).</p>

<form method="post" enctype="multipart/form-data" class="stack">
  {% csrf_token %}
  <div class="field">
    <label for="{{ form.arquivo.id_for_label }}">Arquivo</label>
    {{ form.arquivo }}
    {{ form.arquivo.errors }}
  </div>
  <div class="form-actions">
    <button type="submit" class="btn primary">Enviar</button>
  </div>
</form>
{% endblock %}
